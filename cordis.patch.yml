# 把本插件插进宿主的 loader 配置。
#
# `config` 在 boot 时传给 apply()，由 schemastery 校验（见 src/index.ts 的 Config）。
# 这里只放【默认值】，真实配置写在你 profile 的 cordis.patch.yml 里覆盖。
- insert:
    - id: dsh-goal-budget
      name: dsh-goal-budget
      config:
        budget:
          tokens: 0            # 0 = 不限制
          costUsd: 0           # 单位见 currency
          wallClockMs: 0
        currency: auto         # auto = 用 DeepSeek 余额接口识别（官方线路）；网关线路写 USD 或 CNY
        deepseekCredentialRef: DEEPSEEK_API_KEY
        modelAliases: {}       # 网关给模型改名时在此映射，例如 cm-ais/deepseek-v5-flash: deepseek-flash
        peakPricing: true      # 官方线路 true；网关按固定单价计费时设 false（否则高峰时段高估一倍）
        onExceed: block
        warnAtRatio: 0.8
